// ============ UTILITÀ ============
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pd(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function addD(s,n){const d=pd(s);d.setDate(d.getDate()+n);return iso(d);}
function today(){return iso(new Date());}
function diffD(a,b){return Math.round((pd(b)-pd(a))/86400000);}
function dowIdx(s){return (pd(s).getDay()+6)%7;}
function fmtLong(s){return pd(s).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});}
function fmtShort(s){return pd(s).toLocaleDateString('it-IT',{day:'numeric',month:'short'});}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function r50(x){return Math.round(x/50)*50;}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function $(id){return document.getElementById(id);}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600);}

function blank(){return {v:2,settings:Object.assign({},DEF_SETTINGS),shifts:null,shiftsUpdated:'',overrides:{},weights:{},waist:{},logs:{},days:{},menu:{},shop:{},lastBackup:''};}
function load(){
  let o=null;
  try{o=JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(e){o=null;}
  const b=blank();
  if(!o||typeof o!=='object') return b;
  o.settings=Object.assign({},DEF_SETTINGS,o.settings||{});
  for(const k of ['overrides','weights','waist','logs','days','menu','shop']) if(!o[k]||typeof o[k]!=='object') o[k]={};
  if(!o.v||o.v<2){if(o.settings.start==='2026-11-25')o.settings.start='2026-11-26';o.v=2;}
  return o;
}

// ============ TURNI ============
function rawShift(d){
  const src=(S.shifts&&S.shifts[d])||SNAP[d];
  return src?{c:src[0]||'',sub:src[1]||'',rep:src[2]||[]}:null;
}
function classify(code,sub){
  const c=String(code||'').trim();
  if(SHIFT_INFO[c]) return Object.assign({code:c},SHIFT_INFO[c]);
  if(c===''||c==='-'||c==='0'){
    const lab=SUB_LABEL[sub]||(sub?('Assenza ('+sub+')'):'Libero');
    return {code:'-',t:'libero',lab:lab,ora:''};
  }
  return {code:c,t:'libero',lab:'Turno "'+c+'"',ora:'',unknown:true};
}
function shiftOf(d){
  const r=rawShift(d);
  if(S.overrides[d]!=null){const x=classify(S.overrides[d],'');x.override=true;x.rep=r?r.rep:[];return x;}
  if(!r) return {code:'?',t:'nd',lab:'Turno non disponibile',ora:'',rep:[]};
  const x=classify(r.c,r.sub);x.rep=r.rep;return x;
}
function parseWorkbook(buf,name){
  const wb=XLSX.read(buf,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true});
  if(!rows.length||!rows[1]) throw new Error('Formato file non riconosciuto');
  let year=parseInt(rows[0][0],10)||2026, month=1, prev=0;
  const colDate={};
  for(let c=1;c<rows[1].length;c++){
    const v=rows[1][c];
    if(typeof v!=='number') continue;
    if(v<prev) month++;
    if(month>12){month=1;year++;}
    prev=v;
    const dt=new Date(year,month-1,v);
    if(dt.getMonth()===month-1) colDate[c]=iso(dt);
  }
  const idx=rows.findIndex(r=>r&&String(r[0]||'').trim().toLowerCase()===name.trim().toLowerCase());
  if(idx<0) throw new Error('Nome "'+name+'" non trovato nel file');
  const row=rows[idx], sub=rows[idx+1]||[];
  const key=name.trim().toUpperCase().slice(0,7);
  const repLab=['00-07','07-13','13-20','20-24'];
  const out={};
  for(const c in colDate){
    const code=row[c]==null?'':String(row[c]).trim();
    const sv=sub[c];
    const s=(sv==null||sv===0||sv==='0')?'':String(sv).trim();
    const rep=[];
    for(let i=0;i<4;i++){const rr=rows[28+i];if(rr&&String(rr[c]||'').toUpperCase().indexOf(key)>=0)rep.push(repLab[i]);}
    out[colDate[c]]=[code,s,rep];
  }
  return out;
}
async function refreshShifts(manual){
  if(typeof XLSX==='undefined'){if(manual)toast('Libreria Excel non caricata: sei offline?');return;}
  try{
    const res=await fetch(S.settings.xlsxUrl+'?t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const map=parseWorkbook(new Uint8Array(await res.arrayBuffer()),S.settings.name);
    S.shifts=map;S.shiftsUpdated=new Date().toISOString();save();render();
    if(manual)toast('Turni aggiornati ('+Object.keys(map).length+' giorni)');
  }catch(e){
    if(manual)toast('Aggiornamento turni non riuscito: '+e.message+'. Uso i dati salvati.');
  }
}

// ============ PIANO ============
function weekNo(d){return Math.floor(diffD(S.settings.start,d)/7)+1;}
function phase(d){
  const w=weekNo(d);
  if(w<1) return {w:w,key:'pre',lab:'Prima dell\'inizio',rir:'—'};
  if(w%12===0) return {w:w,key:'mant',lab:'Settimana di mantenimento',rir:'1–2'};
  const bw=((w-1)%8)+1;
  if(w<=1) return {w:w,key:'adatt',lab:'Adattamento',rir:'3'};
  if(bw===8) return {w:w,key:'scarico',lab:'Scarico',rir:'4 (carichi −10%)'};
  return {w:w,key:'prog',lab:'Progressione',rir:'1–2'};
}
function exFor(ex,d){
  if(ex.from&&weekNo(d)<ex.from&&ex.before) return ex.before;
  return ex;
}
function setsFor(ex,d){
  const k=phase(d).key;
  if((k==='adatt'||k==='scarico')&&ex.sets>1) return Math.max(2,ex.sets-1);
  return ex.sets;
}
function buildPlan(end){
  const key=end+'|'+today()+'|'+S.settings.start;
  if(planCache&&planCacheKey===key) return planCache;
  const plan={}, td=today();
  let d=S.settings.start, rot=0, streak=0;
  if(diffD(d,end)>800) end=addD(d,800);
  while(d<=end){
    const sh=shiftOf(d), log=S.logs[d], dd=S.days[d];
    let p;
    if(log&&log.done&&ROT.indexOf(log.session)>=0){
      p={kind:'forza',ses:log.session,done:true};rot=(ROT.indexOf(log.session)+1)%4;streak++;
    }else if(d<td){
      const walked=dd&&dd.walk;
      p={kind:(sh.t==='doppio')?'recupero':'attivo',ses:'W',done:!!walked,missed:!walked};streak=0;
    }else if(d===td&&log&&ROT.indexOf(log.session)>=0){
      p={kind:'forza',ses:log.session,done:false};rot=(ROT.indexOf(log.session)+1)%4;streak++;
    }else if(sh.t==='notte'||sh.t==='smonto'){
      p={kind:'attivo',ses:'W',done:!!(dd&&dd.walk)};streak=0;
    }else if(sh.t==='doppio'){
      p={kind:'recupero',ses:'',done:false};streak=0;
    }else if(streak>=3||(streak>=2&&['notte','smonto','doppio'].indexOf(shiftOf(addD(d,1)).t)<0)){
      p={kind:'attivo',ses:'W',done:!!(dd&&dd.walk)};streak=0;
    }else{
      p={kind:'forza',ses:ROT[rot],done:false};rot=(rot+1)%4;streak++;
    }
    plan[d]=p;d=addD(d,1);
  }
  planCache=plan;planCacheKey=key;
  return plan;
}
function planOf(d){
  if(d<S.settings.start) return {kind:'pre',ses:''};
  const pl=buildPlan(d>today()?d:addD(today(),1));
  return pl[d]||{kind:'pre',ses:''};
}
function planLabel(p){
  if(p.kind==='forza') return 'Forza '+p.ses+' · '+SESSIONS[p.ses].name;
  if(p.kind==='attivo') return 'Giorno attivo · Camminata + mobilità';
  if(p.kind==='recupero') return 'Recupero: solo una passeggiata breve';
  return 'Percorso non ancora iniziato';
}
function planIcon(p){
  if(p.kind==='forza') return p.ses;
  if(p.kind==='attivo') return '🚶';
  if(p.kind==='recupero') return '💤';
  return '';
}

// ============ TARGET NUTRIZIONALI ============
function avgW(from,to){
  const v=Object.keys(S.weights).filter(k=>k>=from&&k<=to).map(k=>S.weights[k]);
  return v.length?{a:v.reduce((x,y)=>x+y,0)/v.length,n:v.length}:null;
}
function curWeight(){
  const td=today();const a=avgW(addD(td,-6),td);
  if(a) return a.a;
  const ks=Object.keys(S.weights).sort();
  return ks.length?S.weights[ks[ks.length-1]]:Number(S.settings.weight0)||95;
}
function targets(d){
  const st=S.settings, w=curWeight();
  const bmr=10*w+6.25*st.height-5*st.age+5;
  const tdee=bmr*st.act;
  const maint=phase(d||today()).key==='mant';
  let kcal=r50(tdee*0.75+Number(st.kcalAdj||0));
  if(maint) kcal=r50(tdee);
  const prot=Math.min(200,Math.round(1.9*w/5)*5);
  const fat=Math.round(0.7*w);
  const carb=Math.max(80,Math.round((kcal-prot*4-fat*9)/4));
  const pP=Math.round(prot/30);
  const pC=clamp(Math.round((kcal-pP*140-3*90-2*70-2*50-120)/160),2,maint?8:6);
  return {w:w,bmr:Math.round(bmr),tdee:r50(tdee),kcal:kcal,prot:prot,fat:fat,carb:carb,por:{P:pP,C:pC,G:3,Fr:2,V:2},maint:maint};
}

function wb(key){return '<button class="whyb" title="Perché?" onclick="event.stopPropagation();why(\''+key+'\');return false">?</button>';}
function wbEx(id){return '<button class="whyb" title="Perché?" onclick="event.stopPropagation();whyEx(\''+id+'\')">?</button>';}
function showWhy(title,paras,more){
  let h='<div class="row between" style="flex-wrap:nowrap"><h2 class="cond" style="margin:0;font-size:22px">💡 '+esc(title)+'</h2><button class="btn sm ghost" onclick="closeSheet()">✕</button></div>';
  h+='<div class="card" style="margin-top:10px">'+paras.map(p=>'<p style="margin:6px 0;line-height:1.5">'+esc(p)+'</p>').join('')+'</div>';
  if(more) h+=more;
  $('sheetIn').innerHTML=h;$('sheet').classList.add('on');
}
function why(key){
  const w=WHY[key];if(!w)return;
  const rel=Object.keys(WHY).filter(k=>k!==key&&WHY[k].g===w.g&&k.indexOf('fase_')<0&&k.indexOf('plan_')<0&&k.indexOf('meal_')<0).slice(0,6);
  const more='<div class="small mute" style="margin:4px 2px 6px">Altri perché</div><div class="row">'+rel.map(k=>'<button class="btn sm ghost" onclick="why(\''+k+'\')">'+esc((x=>x.charAt(0).toUpperCase()+x.slice(1))(WHY[k].t.replace(/^Perché /,'').replace(/\?$/,'')))+'</button>').join('')+'</div>';
  showWhy(w.t,w.x,more);
}
function whyEx(id){
  let ex=null;
  for(const s in SESSIONS) for(const e of SESSIONS[s].ex){if(e.id===id)ex=e;if(e.before&&e.before.id===id)ex=e.before;}
  showWhy(ex?ex.n:'Esercizio',[EX_WHY[id]||'']);
}
function whyFood(f){
  const F=FOODS[f];if(!F)return;
  showWhy(F.n,[FOOD_WHY[f]||'',(Math.round(F.k))+' kcal per 100 g · proteine '+F.p+' g · carboidrati '+F.c+' g · grassi '+F.f+' g']);
}
function vWhyLib(){

  for(const g of ['Allenamento','Alimentazione','Misure']){
    const ks=Object.keys(WHY).filter(k=>WHY[k].g===g&&k!=='fase_pre');
    h+='<h3>'+g+'</h3><ul class="tl">'+ks.map(k=>'<li style="cursor:pointer" onclick="why(\''+k+'\')"><span class="k">💡</span><span class="b">'+esc(WHY[k].t)+'</span></li>').join('')+'</ul>';
  }
  h+='<h3>Esercizi</h3><ul class="tl">';
  const seen={};
  for(const s of ['A','B','C','D','W']) for(const e0 of SESSIONS[s].ex) for(const e of [e0.before,e0]){if(!e||seen[e.id])continue;seen[e.id]=1;h+='<li style="cursor:pointer" onclick="whyEx(\''+e.id+'\')"><span class="k">'+(s==='W'?'🚶':s)+'</span><span class="b">'+esc(e.n)+'</span></li>';}
  h+='</ul><h3>Alimenti</h3><ul class="tl">';
  for(const [cat,lab] of CATS){const fs=Object.keys(FOODS).filter(f=>FOODS[f].cat===cat);h+=fs.map(f=>'<li style="cursor:pointer" onclick="whyFood(\''+f+'\')"><span class="k">'+lab.split(' ')[0]+'</span><span class="b">'+esc(FOODS[f].n)+'</span></li>').join('');}
  return h+'</ul></div>';
}

    let diff=tg[r]-sl.reduce((a,s)=>a+(s.por[r]||0),0), guard=0;

        const s=sl.find(x=>x.m===m);if(!s)continue;
        if(diff>0){s.por[r]=(s.por[r]||0)+1;diff--;ch=true;break;}
        if((s.por[r]||0)>0){s.por[r]--;diff++;ch=true;break;}
      }
      if(!ch)break;
    }
  }
  let k=0;sl.forEach(s=>{s.k=(s.m==='spuntino'||s.m==='servizio'||s.m==='notte')?k++:0;});
  return sl;
}
function dayN(d){return diffD('2026-01-05',d);}
function recipeFor(d,s){
  const ov=S.menu[d]&&S.menu[d][s.i];
  if(ov&&RECIPES[ov]&&POOLS[s.m].indexOf(ov)>=0) return ov;
  const pool=POOLS[s.m], n=dayN(d);
  const mult={colazione:1,pranzo:3,cena:7}[s.m]||1, off={cena:4}[s.m]||s.k*2;
  return pool[(((n*mult+off)%pool.length)+pool.length)%pool.length];
}
function filler(role,m,n){
  const main=(m==='pranzo'||m==='cena');
  if(role==='C') return [[main?'pane':'fette',main?70:45]];
  if(role==='G') return [[main?'olio':'mandorle',main?10:15]];
  if(role==='Fr') return [[['mela','arancia','kiwi','pera'][((n%4)+4)%4],150]];
  if(role==='V') return [['insalata',250]];
  return [['yogurt',250]];
}
function macOf(items){
  const m={k:0,p:0,c:0,f:0};
  for(const it of items){const F=FOODS[it.f];if(!F)continue;const q=it.g/100;m.k+=F.k*q;m.p+=F.p*q;m.c+=F.c*q;m.f+=F.f*q;}
  return m;
}
function mealOf(d,s,force){
  const rid=force||recipeFor(d,s), r=RECIPES[rid], n=dayN(d)+s.k, map={}, extra=[];
  for(const role of ['P','C','G','Fr','V']){
    let u=s.por[role]||0;
    if(role==='G') u=Math.max(0,u-(r.fi||0)*(s.por.P||0));
    if(u<=0) continue;
    let src=r[role];
    if(!src||!src.length){src=filler(role,s.m,n);extra.push(role);}
    for(const [f,g] of src) map[f]=(map[f]||0)+g*u;
  }
  const items=Object.keys(map).map(f=>({f:f,g:f==='uova'?Math.round(map[f]/60)*60:Math.max(5,Math.round(map[f]/5)*5)}));
  return {rid:rid,r:r,items:items,mac:macOf(items),extra:extra};
}
function dayMenu(d){
  const sl=slotsOf(d), used={};
  const meals=sl.map(s=>{
    let rid=recipeFor(d,s);
    const ov=S.menu[d]&&S.menu[d][s.i];
    if(used[rid]&&!ov){const pool=POOLS[s.m];for(let j=1;j<pool.length;j++){const c=pool[(pool.indexOf(rid)+j)%pool.length];if(!used[c]){rid=c;break;}}}
    used[rid]=1;return {s:s,meal:mealOf(d,s,rid)};
  });
  const tot={k:0,p:0,c:0,f:0};
  for(const x of meals) for(const k in tot) tot[k]+=x.meal.mac[k];
  return {meals:meals,tot:tot};
}
function itemTxt(it){
  const F=FOODS[it.f];
  if(it.f==='uova'){const n=Math.round(it.g/60);return n+(n===1?' uovo':' uova');}
  if(it.f==='olio') return F.n+' '+it.g+' g ('+(it.g/10===1?'1 cucchiaio':(it.g/10).toString().replace('.',',')+' cucchiai')+')';
  let t=F.n+' '+it.g+' g';
  if(F.cat==='frutta'&&F.pz&&it.f!=='avocado'){const n=Math.max(1,Math.round(it.g/F.pz));t+=' ('+n+' pz)';}
  return t;
}

function qtyTxt(f,g){

function drawBars(id,labels,stacks,colors,target,opts){
  const cv=$(id);if(!cv)return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth||340, H=cv.clientHeight||200;
  cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,W,H);
  const tots=stacks.map(s=>s?s.reduce((a,b)=>a+b,0):0);
  const mx=Math.max(target*1.15,...tots,100);
  const L=38,R=6,T=8,B=22,bw=(W-L-R)/labels.length;
  const y=v=>T+(H-T-B)*(1-v/mx);
  c.font='11px Barlow,sans-serif';c.fillStyle='#6b7487';c.strokeStyle='#e3e7ef';c.lineWidth=1;
  for(let i=0;i<=4;i++){const v=mx*i/4;c.beginPath();c.moveTo(L,y(v));c.lineTo(W-R,y(v));c.stroke();c.fillText(Math.round(v),2,y(v)+4);}
  labels.forEach((lb,i)=>{
    const x0=L+i*bw+bw*0.18, w=bw*0.64;
    if(stacks[i]){let acc=0;stacks[i].forEach((v,j)=>{const col=typeof colors==='function'?colors(i,tots[i]):colors[j];c.fillStyle=col;c.fillRect(x0,y(acc+v),w,y(acc)-y(acc+v));acc+=v;});}
    c.fillStyle='#6b7487';const tw=c.measureText(lb).width;c.fillText(lb,L+i*bw+(bw-tw)/2,H-6);
  });
  c.strokeStyle='#dc2626';c.setLineDash([5,4]);c.lineWidth=2;c.beginPath();c.moveTo(L,y(target));c.lineTo(W-R,y(target));c.stroke();c.setLineDash([]);
}

function analysis(){
  const td=today();
  const a0=avgW(addD(td,-6),td), a1=avgW(addD(td,-13),addD(td,-7)), a2=avgW(addD(td,-20),addD(td,-14));
  const out={a0:a0,a1:a1,a2:a2,msg:'',cls:'info',act:0};
  const nW=weekNo(td);
  if(!a0||a0.n<2||!a1||a1.n<2){out.msg='Pesati almeno 3–4 mattine a settimana: dopo 2 settimane di dati qui comparirà il controllo automatico.';return out;}
  const r1=(a1.a-a0.a)/a1.a*100;out.r1=r1;
  let r2=null;if(a2&&a2.n>=2)r2=(a2.a-a1.a)/a2.a*100;out.r2=r2;
  const wk=Object.keys(S.waist).sort();let wDrop=null;
  if(wk.length>=2){const last=wk[wk.length-1];const old=wk.filter(k=>k<=addD(last,-12));if(old.length)wDrop=S.waist[old[old.length-1]]-S.waist[last];}
  const canAdj=!S.settings.lastAdj||diffD(S.settings.lastAdj,td)>=14;
  if(nW<=2){out.msg='Prime 2 settimane: è normale un calo rapido, dovuto in gran parte all\'acqua. Non cambiare nulla.';out.cls='ok';return out;}
  if(r1<0.3&&(r2===null||r2<0.3)){
    if(wDrop!==null&&wDrop>=1){out.msg='Il peso è fermo ma la vita è scesa di '+wDrop.toFixed(1)+' cm: stai perdendo grasso e mettendo muscolo. Non cambiare nulla.';out.cls='ok';}
    else if(canAdj){out.msg='Il calo è rallentato (meno dello 0,3% a settimana). Togli 150 kcal (circa 1 porzione di carboidrati) oppure aggiungi 2.000 passi al giorno.';out.cls='warn';out.act=-150;}
    else{out.msg='Il calo è rallentato, ma hai già fatto una correzione da poco: aspetta 2 settimane dalla modifica.';out.cls='info';}
  }else if(r1>1.2&&(r2===null||r2>1.2)){
    if(canAdj){out.msg='Stai scendendo troppo in fretta (più dell\'1,2% a settimana): rischi di perdere muscolo. Aggiungi 150 kcal.';out.cls='warn';out.act=150;}
    else out.msg='Calo veloce: tieni d\'occhio la forza negli allenamenti.';
  }else{out.msg='Sei in linea (obiettivo 0,5–1% a settimana). Continua così.';out.cls='ok';}
  return out;
}
function vProg(){
  const td=today(), an=analysis(), t=targets(td);
  const ws=Object.keys(S.weights).sort(), wa=Object.keys(S.waist).sort();
  const w0=ws.length?S.weights[ws[0]]:null;
  let h='<div class="card"><h2>Nuova misurazione</h2><div class="small mute">Perché la media?'+wb('peso')+' Perché la vita?'+wb('vita')+'</div><label class="f">Data</label><input type="date" id="mD" value="'+td+'"><div class="row" style="margin-top:8px"><div><label class="f">Peso (kg)</label><input type="number" step="0.1" inputmode="decimal" id="mW"></div><div><label class="f">Vita (cm)</label><input type="number" step="0.5" inputmode="decimal" id="mV"></div></div><button class="btn" style="margin-top:10px" onclick="saveMeas()">Salva</button>';
  h+='<p class="small mute">Peso: ogni mattina, oppure almeno 3–4 volte a settimana, a digiuno dopo il bagno. Conta la media settimanale, non il singolo giorno. Vita: una volta a settimana, sempre di lunedì mattina. Foto: ogni 4 settimane, stessa luce e stessa posizione.</p></div>';
  h+='<div class="card"><h2>Andamento</h2><div class="kpis"><div class="k"><div class="v">'+(w0!=null?w0.toFixed(1):'—')+'</div><div class="l">partenza</div></div><div class="k"><div class="v">'+(an.a0?an.a0.a.toFixed(1):'—')+'</div><div class="l">media 7 gg</div></div><div class="k"><div class="v">'+(w0!=null&&an.a0?((an.a0.a-w0>0?'+':'')+(an.a0.a-w0).toFixed(1)):'—')+'</div><div class="l">kg totali</div></div></div>';
  h+='<canvas id="chart" width="680" height="220" style="margin-top:10px"></canvas><div class="small mute">Punti: pesate singole · linea: media mobile di 7 giorni</div></div>';
  h+='<div class="card"><h2>Controllo settimanale'+wb('controllo')+'</h2><div class="alert '+an.cls+'" style="margin:0">'+esc(an.msg)+'</div>';
  if(an.r1!=null) h+='<p class="small mute">Ultima settimana: '+(an.r1>=0?'−':'+')+Math.abs(an.r1).toFixed(2)+'%'+(an.r2!=null?(' · settimana precedente: '+(an.r2>=0?'−':'+')+Math.abs(an.r2).toFixed(2)+'%'):'')+'</p>';
  if(an.act) h+='<button class="btn gold" style="margin-top:8px" onclick="applyAdj('+an.act+')">Applica '+(an.act>0?'+':'')+an.act+' kcal</button>';
  h+='<p class="small mute">Obiettivo attuale: '+t.kcal+' kcal. Correzione totale applicata: '+(S.settings.kcalAdj>0?'+':'')+S.settings.kcalAdj+' kcal. Ogni 12 settimane è prevista una settimana di mantenimento.</p></div>';
  h+='<div class="card"><h2>Storico</h2><table class="pt"><tr><th>Data</th><th>Peso</th><th>Vita</th><th></th></tr>';
  const all=[...new Set(ws.concat(wa))].sort().reverse().slice(0,40);
  for(const d of all) h+='<tr><td>'+fmtShort(d)+'</td><td>'+(S.weights[d]!=null?S.weights[d]+' kg':'')+'</td><td>'+(S.waist[d]!=null?S.waist[d]+' cm':'')+'</td><td><button class="btn sm ghost" onclick="delMeas(\''+d+'\')">✕</button></td></tr>';
  if(!all.length) h+='<tr><td colspan="4" class="mute">Nessuna misurazione</td></tr>';
  h+='</table></div>';
  const done=Object.keys(S.logs).filter(k=>S.logs[k].done).length, walks=Object.keys(S.days).filter(k=>S.days[k].walk).length;
  h+='<div class="card"><h2>Costanza</h2><div class="kpis"><div class="k"><div class="v">'+done+'</div><div class="l">sessioni di forza</div></div><div class="k"><div class="v">'+walks+'</div><div class="l">giorni attivi</div></div><div class="k"><div class="v">'+Math.max(0,weekNo(td))+'</div><div class="l">settimana</div></div></div></div>';
  return h;
}
function drawChart(){
  const cv=$('chart');if(!cv)return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth||340, H=cv.clientHeight||220;
  cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,W,H);
  const ks=Object.keys(S.weights).sort();
  c.font='12px Barlow,sans-serif';c.fillStyle='#6b7487';
  if(ks.length<2){c.fillText('Servono almeno 2 pesate per il grafico',10,H/2);return;}
  const vals=ks.map(k=>S.weights[k]);
  const mn=Math.floor(Math.min(...vals)-1), mx=Math.ceil(Math.max(...vals)+1);
  const d0=ks[0], span=Math.max(1,diffD(d0,ks[ks.length-1]));
  const L=36,R=8,T=10,B=22;
  const x=d=>L+(W-L-R)*diffD(d0,d)/span, y=v=>T+(H-T-B)*(mx-v)/(mx-mn);
  c.strokeStyle='#e3e7ef';c.lineWidth=1;
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;c.beginPath();c.moveTo(L,y(v));c.lineTo(W-R,y(v));c.stroke();c.fillText(v.toFixed(0),4,y(v)+4);}
  c.fillText(fmtShort(d0),L,H-6);const le=fmtShort(ks[ks.length-1]);c.fillText(le,W-R-c.measureText(le).width,H-6);
  c.fillStyle='#9aa3b5';
  for(const k of ks){c.beginPath();c.arc(x(k),y(S.weights[k]),3,0,7);c.fill();}
  c.strokeStyle='#f2b705';c.lineWidth=3;c.beginPath();
  ks.forEach((k,i)=>{const a=avgW(addD(k,-6),k).a;if(i===0)c.moveTo(x(k),y(a));else c.lineTo(x(k),y(a));});
  c.stroke();
}

// ============ AZIONI ============
function go(t){curTab=t;if(t!=='all')wDate=wDate;render();window.scrollTo(0,0);}
function inc(k,n){const dd=day(today());dd[k]=Math.max(0,(dd[k]||0)+n);save();render();}
function setSteps(v){day(today()).steps=v;save();}
function toggleWalk(d){const dd=day(d);dd.walk=!dd.walk;save();render();if(dd.walk)toast('Giorno attivo registrato 👍');}
function setMed(){S.settings.medOk=true;save();render();}
function saveQW(){const v=parseFloat($('qw').value);if(!(v>30&&v<300)){toast('Inserisci un peso valido');return;}S.weights[today()]=Math.round(v*10)/10;save();render();toast('Peso salvato');}
function saveMeas(){
  const d=$('mD').value||today(), w=parseFloat($('mW').value), v=parseFloat($('mV').value);
  let ok=false;
  if(w>30&&w<300){S.weights[d]=Math.round(w*10)/10;ok=true;}
  if(v>40&&v<250){S.waist[d]=Math.round(v*2)/2;ok=true;}
  if(!ok){toast('Inserisci almeno peso o vita');return;}
  save();render();toast('Misurazione salvata');
}
function delMeas(d){if(!confirm('Eliminare le misure del '+fmtShort(d)+'?'))return;delete S.weights[d];delete S.waist[d];save();render();}
function applyAdj(n){S.settings.kcalAdj=Number(S.settings.kcalAdj||0)+n;S.settings.lastAdj=today();save();render();toast('Nuovo obiettivo: '+targets().kcal+' kcal');}
function openW(d){wDate=d;curTab='all';const p=planOf(d);if(!S.logs[d]&&p.kind==='forza'){S.logs[d]={session:p.ses,sets:{},done:false};save();}render();window.scrollTo(0,0);}
function pickSes(s){const d=today();S.logs[d]=Object.assign({sets:{},done:false},S.logs[d]||{},{session:s});save();wDate=d;render();window.scrollTo(0,0);}
function setLog(ex,i,f,v){
  const d=wDate;if(!S.logs[d]){const p=planOf(d);S.logs[d]={session:p.ses||'A',sets:{},done:false};}
  const L=S.logs[d];if(!L.sets)L.sets={};if(!L.sets[ex])L.sets[ex]=[];
  if(!L.sets[ex][i])L.sets[ex][i]={};
  L.sets[ex][i][f]=v===''?null:Number(v);save();
}
function finishW(){
  const d=wDate;if(!S.logs[d]){const p=planOf(d);S.logs[d]={session:p.ses||'A',sets:{},done:false};}
  S.logs[d].done=!S.logs[d].done;save();render();
  if(S.logs[d].done)toast('Sessione registrata 💪');
}
function calNav(n){calM+=n;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}render();}
function saveSet(){
  const st=S.settings;
  const g=id=>$(id)?$(id).value:null;
  if(g('sAge')!=null){st.age=Number(g('sAge'))||st.age;st.height=Number(g('sH'))||st.height;st.weight0=Number(g('sW0'))||st.weight0;st.act=Number(g('sAct'))||1.5;st.start=g('sStart')||st.start;st.kcalAdj=Number(g('sAdj'))||0;st.medOk=$('sMed').checked;}
  if(g('sName'))st.name=g('sName').trim();
  if(g('sUrl'))st.xlsxUrl=g('sUrl').trim();
  save();render();toast('Impostazioni salvate');
}
function clearOv(){if(!confirm('Rimuovere tutte le modifiche manuali ai turni?'))return;S.overrides={};save();render();}
async function exportData(){
  const name='fit-turni-backup-'+today()+'.json';
  const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  S.lastBackup=today();save();render();
  try{const f=new File([b],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Backup Fit Turni'});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function resetAll(){if(!confirm('Cancellare tutti i dati? Fai prima un backup.'))return;S=blank();save();render();}

// ============ TIMER ============
function beep(){
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25,0.5].forEach(t=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(0.25,audioCtx.currentTime+t);o.start(audioCtx.currentTime+t);o.stop(audioCtx.currentTime+t+0.15);});
  }catch(e){}
}
function startTimer(sec){
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  timerEnd=Date.now()+sec*1000;$('timer').classList.add('on');tick();
  clearInterval(timerInt);timerInt=setInterval(tick,250);
}
function tick(){
  const s=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));
  $('tv').textContent=Math.floor(s/60)+':'+pad(s%60);
  if(s<=0){stopTimer();beep();if(navigator.vibrate)navigator.vibrate([300,120,300]);toast('Recupero finito: prossima serie!');}
}
function stopTimer(){clearInterval(timerInt);timerInt=null;$('timer').classList.remove('on');}

// ============ AVVIO ============
function init(){
  S=load();
  document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.t==='all'&&curTab!=='all')wDate='';go(b.dataset.t);}));
  $('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});
  $('tPlus').addEventListener('click',()=>{timerEnd+=15000;tick();});
  $('tStop').addEventListener('click',stopTimer);
  $('impFile').addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.settings)throw new Error();localStorage.setItem(LS_KEY,JSON.stringify(o));S=load();planCache=null;render();toast('Backup importato');}catch(err){toast('File di backup non valido');}e.target.value='';};
    r.readAsText(f);
  });
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  render();
  const last=S.shiftsUpdated?new Date(S.shiftsUpdated).getTime():0;
  if(Date.now()-last>6*3600*1000) refreshShifts(false);
}
document.addEventListener('DOMContentLoaded',init);
</script>
